<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Under Construction</title>
  <meta
    name="description"
    content="Something new is taking shape. Check back soon."
  >
  <meta name="theme-color" content="#11120f">

  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f2ff70'/%3E%3Cpath d='M16 42h32v7H16zm5-9h22v6H21zm6-10h10v7H27z' fill='%2311120f'/%3E%3C/svg%3E"
  >

  <style>
    :root {
      color-scheme: dark;
      --background: #11120f;
      --text: #f4f4ed;
      --accent: #f2ff70;
      --muted: #a8aa9e;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100svh;
      overflow: hidden;
      background: var(--background);
      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -45%;
      opacity: 0.12;
      transform: rotate(-9deg);
      background-image:
        linear-gradient(var(--text) 1px, transparent 1px),
        linear-gradient(90deg, var(--text) 1px, transparent 1px);
      background-size: 72px 72px;
      animation: drift 22s linear infinite;
    }

    main {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100svh;
      padding: clamp(24px, 4vw, 58px);
    }

    header,
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--muted);
    }

    .mark {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 7px rgb(242 255 112 / 10%);
    }

    .eyebrow,
    footer {
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .hero {
      align-self: center;
      max-width: 1050px;
      padding: 9vh 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(4.4rem, 13vw, 11.5rem);
      font-weight: 750;
      line-height: 0.76;
      letter-spacing: -0.075em;
      text-wrap: balance;
    }

    h1 span {
      display: block;
      margin-left: clamp(18px, 11vw, 155px);
      color: var(--accent);
    }

    .note {
      max-width: 34rem;
      margin: clamp(42px, 7vw, 76px) 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 1.5vw, 1.22rem);
      line-height: 1.65;
    }

    .line {
      flex: 1;
      height: 1px;
      background: rgb(244 244 237 / 18%);
    }

    .year {
      color: var(--muted);
      white-space: nowrap;
    }

    @keyframes drift {
      to {
        transform: rotate(-9deg) translate(72px, 72px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body::before {
        animation: none;
      }
    }

    @media (max-width: 600px) {
      main {
        padding: 24px;
      }

      h1 {
        font-size: clamp(4rem, 22vw, 7rem);
        line-height: 0.82;
      }

      h1 span {
        margin-left: 0;
      }

      .note {
        max-width: 20rem;
      }

      footer .line {
        display: none;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <div class="status">
        <span class="mark" aria-hidden="true"></span>
        <span class="eyebrow">Work in progress</span>
      </div>

      <span class="eyebrow">Coming soon</span>
    </header>

    <section class="hero" aria-labelledby="page-title">
      <h1 id="page-title">
        Under
        <span>construction.</span>
      </h1>

      <p class="note">
        Something new is taking shape. We’re putting the finishing
        touches on it now—check back soon.
      </p>
    </section>

    <footer>
      <span>Building something worthwhile</span>
      <span class="line" aria-hidden="true"></span>
      <span class="year">© <span id="year"></span></span>
    </footer>
  </main>

  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();
  </script>
</body>
</html>
